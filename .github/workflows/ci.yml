name: Agent Coach CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-gate:
    name: Windows Gate (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify the committed release checksum
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath 'AGENTS.md' -Encoding utf8 -TotalCount 1
          if ($header -notmatch 'v(\d+\.\d+\.\d+)\s+\((\d{4})-(\d{2})-(\d{2})\)') { throw 'Invalid release header' }
          $dir = "releases/v$($Matches[1])"
          $zip = "agent-coach-v$($Matches[1])-$($Matches[2])$($Matches[3])$($Matches[4]).zip"
          $sumLine = Get-Content -LiteralPath "$dir/SHA256SUMS.txt" -TotalCount 1
          if ($sumLine -cnotmatch ('^([0-9a-f]{64})  ' + [regex]::Escape($zip) + '$')) { throw "Unexpected checksum: $sumLine" }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath "$dir/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "AGENT_COACH_TEST_RELEASE=$((Resolve-Path -LiteralPath $dir).Path)" >> $env:GITHUB_ENV
          if ($expected -ne $actual) {
            throw "SHA256 mismatch: expected $expected, got $actual"
          }
          $install = Join-Path $env:RUNNER_TEMP 'agent-coach-installed'
          Expand-Archive -LiteralPath "$dir/$zip" -DestinationPath $install
          "COACH_PRODUCT=$install" >> $env:GITHUB_ENV

      - name: Syntax check both installed tools
        shell: pwsh
        run: |
          node --check (Join-Path $env:COACH_PRODUCT '工具/coach-check.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check (Join-Path $env:COACH_PRODUCT '工具/eli5-report.mjs')

      - name: Install Playwright and Chromium for the Windows gate
        shell: pwsh
        run: |
          $gate = Join-Path $env:RUNNER_TEMP 'pw-gate'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $gate 'browsers'
          npm.cmd install --prefix $gate --no-save --no-package-lock playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $gate 'node_modules/playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_COACH_TEST_PLAYWRIGHT=$(Join-Path $gate 'node_modules/playwright/index.mjs')" >> $env:GITHUB_ENV
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" >> $env:GITHUB_ENV

      - name: Run all suites against the committed package
        shell: pwsh
        run: node --test --test-concurrency=1 tests/fast-accept.test.mjs tests/hybrid-v118.test.mjs tests/governance-v120.test.mjs tests/fingerprint-v121.test.mjs tests/rescue-v200.test.mjs tests/diagnostics-v210.test.mjs
