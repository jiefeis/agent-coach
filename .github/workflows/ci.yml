name: Agent Coach CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-gate:
    name: Windows Gate (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check coach-check.mjs
        shell: pwsh
        run: node --check "工具/coach-check.mjs"

      - name: Verify the committed release checksum
        shell: pwsh
        run: |
          $sumLine = Get-Content -LiteralPath "releases/v1.20/SHA256SUMS.txt" -TotalCount 1
          if ($sumLine -notmatch '^([0-9a-f]{64})\s+agent-coach-v1\.20-20261112\.zip$') {
            throw "Unexpected SHA256SUMS.txt format: $sumLine"
          }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath "releases/v1.20/agent-coach-v1.20-20261112.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "SHA256 mismatch: expected $expected, got $actual"
          }

      - name: Run all suites against the committed package
        env:
          AGENT_COACH_TEST_RELEASE: ${{ github.workspace }}/releases/v1.20
        shell: pwsh
        run: node --test tests/fast-accept.test.mjs tests/hybrid-v118.test.mjs tests/governance-v120.test.mjs
