name: Agent Coach CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-gate:
    name: Windows Gate (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check coach-check.mjs
        shell: pwsh
        run: node --check "工具/coach-check.mjs"

      - name: Verify the committed release checksum
        shell: pwsh
        run: |
          $header = Get-Content -LiteralPath 'AGENTS.md' -Encoding utf8 -TotalCount 1
          if ($header -notmatch 'v(\d+\.\d+\.\d+)\s+\((\d{4})-(\d{2})-(\d{2})\)') { throw 'Invalid release header' }
          $dir = "releases/v$($Matches[1])"
          $zip = "agent-coach-v$($Matches[1])-$($Matches[2])$($Matches[3])$($Matches[4]).zip"
          $sumLine = Get-Content -LiteralPath "$dir/SHA256SUMS.txt" -TotalCount 1
          if ($sumLine -cnotmatch ('^([0-9a-f]{64})  ' + [regex]::Escape($zip) + '$')) { throw "Unexpected checksum: $sumLine" }
          $expected = $Matches[1]
          $actual = (Get-FileHash -LiteralPath "$dir/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "AGENT_COACH_TEST_RELEASE=$((Resolve-Path -LiteralPath $dir).Path)" >> $env:GITHUB_ENV
          if ($expected -ne $actual) {
            throw "SHA256 mismatch: expected $expected, got $actual"
          }

      - name: Run all suites against the committed package
        shell: pwsh
        run: node --test --test-concurrency=1 tests/fast-accept.test.mjs tests/hybrid-v118.test.mjs tests/governance-v120.test.mjs tests/fingerprint-v121.test.mjs tests/rescue-v200.test.mjs
