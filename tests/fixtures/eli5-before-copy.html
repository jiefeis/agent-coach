</style></head><body><main><header><p class="when">2026-11-25 · 项目组</p><h1>旧页</h1><p class="conclusion">等待核对</p></header><nav aria-label="筛选本批条目"><button type="button" data-filter="all" aria-pressed="true">全部</button><button type="button" data-filter="正常" aria-pressed="false">正常</button><button type="button" data-filter="异常" aria-pressed="false">异常</button><button type="button" data-filter="待核" aria-pressed="false">待核</button><span data-visible-count aria-live="polite"></span></nav><div data-visual><svg class="wide" viewBox="0 0 728 452" aria-label="当批输入经规则判断流向正常、异常和待核"><defs><pattern id="paper-w" width="19" height="19" patternUnits="userSpaceOnUse"><circle class="dot" cx="1" cy="1" r=".8"/></pattern><marker id="arrow-w" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path fill="context-stroke" d="M0 0L8 4L0 8Z"/></marker></defs><rect class="paper" width="728" height="452"/><rect fill="url(#paper-w)" width="728" height="452"/><g data-node="all" class="node active " transform="translate(105 217)"><rect class="box" x="-70" y="-47" width="140" height="94" rx="14"/><text class="label" y="-6">当批输入</text><text class="number" y="22">0</text></g><g data-node="gate" class="node active " transform="translate(337 217)"><path class="box" d="M-47 -46H47l18 18v56l-18 18H-47l-18 -18v-56z"/><text class="label" y="7">规则判断</text></g><g data-node="正常" class="node active good" transform="translate(612 107)" role="button" tabindex="0" aria-label="筛选正常"><rect class="box" x="-66" y="-41" width="132" height="82" rx="14"/><text class="label" y="-6">正常交付</text><text class="number" y="22">0</text></g><g data-node="异常" class="node active bad" transform="translate(612 217)" role="button" tabindex="0" aria-label="筛选异常"><rect class="box" x="-66" y="-41" width="132" height="82" rx="14"/><text class="label" y="-6">异常退回</text><text class="number" y="22">0</text></g><g data-node="待核" class="node active hold" transform="translate(612 327)" role="button" tabindex="0" tem-panel><h2 id="item-title"></h2><dl class="sequence"><div><dt>进门</dt><dd data-item-field="input"></dd></div><div><dt>判断与依据</dt><dd data-item-field="rule"></dd><dd data-item-field="basis"></dd></div><div><dt>去向／异常</dt><dd data-item-field="action"></dd><dd data-item-field="exception"></dd></div></dl></section></div><details><summary>本批统计</summary><p>本批无登记。</p></details><details><summary>证据与出处</summary><p>本批无登记。</p></details><details><summary>术语</summary><p>本批无登记。</p></details><details><summary>待拍板事项</summary><ul><li><strong>是否交付？</strong><p>先核对</p><button type="button" class="copy" data-copy="0">复制给 AI</button></li></ul></details><div class="feedback"><p role="status" data-copy-status></p><textarea readonly hidden aria-label="复制用指令"></textarea></div></main><script id="eli5-data" type="application/json">{"batch":{"报告日":"2026-11-25"},"date":"2026-11-25","title":"旧页","audience":"项目组","conclusion":"等待核对","stats":[],"items":[],"decisions":[{"question":"是否交付？","proposal":"先核对"}],"evidence":[],"terms":[]}</script><script>const validFact=fact => typeof fact==='string' && !!fact.trim() && !/^待核(?:[：:]|$)/.test(fact.trim());
function effectiveState(item) {
  if (item.state==='待核' || ![item.input,item.rule,item.basis].every(validFact)) return '待核';
  return validFact(item.state==='正常'?item.action:item.exception) ? item.state : '待核';
}

const data=JSON.parse(document.querySelector('#eli5-data').textContent);
const statuses=data.items.map(effectiveState);
const count=document.querySelector('[data-visible-count]');
const select=document.querySelector('#item');
const field=document.querySelector('textarea');
const status=document.querySelector('[data-copy-status]');
let filter='all', current=0;
function choose() {
  const section=document.querySelector('[data-item-panel]'), title=section.querySelector('#item-title');
  const fields=section.querySelectorAll('[data-item-field]');
  if (select.value==='') {
    current=-1;
    section.hidden=true;
    title.textContent='';
    for (const field of fields) field.textContent='';
    return;
  }
  current=Number(select.value);
  const x=data.items[current];
  section.hidden=false;
  title.textContent=x.label+' · '+statuses[current];
  for (const field of fields) {
    const value=x[field.dataset.itemField];
    field.textContent=validFact(value) ? value : '待核';
  }
}
function show() {
  const rows=data.items.flatMap((x,i)=>filter==='all'||statuses[i]===filter?[i]:[]);
  for(const b of document.querySelectorAll('[data-filter]')) b.setAttribute('aria-pressed',String(b.dataset.filter===filter));
  count.textContent='可见 '+rows.length+' / 全批 '+data.items.length+' 条';
  document.querySelector('[data-empty]').hidden=!!rows.length;
  document.querySelector('[data-empty]').textContent=data.items.length?'这一类没有记录。':'本批没有逐项记录';
  document.querySelector('[data-pick]').hidden=!rows.length;
  for(const node of document.querySelectorAll('[data-node]')) {
    const key=node.dataset.node;
    const active=filter==='all'||['all','gate',filter].includes(key);
    node.classList.toggle('active',active);
    if(node.hasAttribute('role')) node.setAttribute('aria-pressed',String(key===filter));
  }
  for(const edge of document.querySelectorAll('[data-edge]'))
    edge.classList.toggle('active',filter==='all'||['gate',filter].includes(edge.dataset.branch));
  select.replaceChildren(...rows.map(i=>new Option(data.items[i].label,i)));
  select.value=String(rows.includes(current)?current:rows[0] ?? '');
  choose();
}
select.addEventListener('change',choose);
const filterTo=state=>{filter=state;show();};
document.querySelector('[data-visual]').addEventListener('click',e=>{
  const target=e.target.closest('[role="button"][data-node]');if(target)filterTo(target.dataset.node);
});
document.querySelector('[data-visual]').addEventListener('keydown',e=>{
  const target=e.target.closest('[role="button"][data-node]');
  if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();filterTo(target.dataset.node);}
});
document.addEventListener('click',async e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.dataset.filter)filterTo(button.dataset.filter);
  if(button.dataset.copy===undefined)return;
  const decision=data.decisions[Number(button.dataset.copy)];
  const one=s=>String(s ?? '待核').replace(/[\p{Cc}\p{Cf}\u2028\u2029]+/gu,' ').trim();
  const batch=document.querySelector('meta[name="coach-batch"]').content;
  const instruction='请按「'+one(data.title)+'」的批次「'+batch+'」和我核对「'+one(decision.question)+'」。建议：'+one(decision.proposal)+'。请列依据和影响，等我确认再执行。';
  try{await navigator.clipboard.writeText(instruction);field.hidden=true;status.textContent='已复制';}
  catch{field.value=instruction;field.hidden=false;field.focus();field.select();status.textContent='已全选，请复制';}
});
show();
</script></body></html>
